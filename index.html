<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บ้านธรรมสถิตย์ - Baan Thumsathis</title>
    <style>
        :root {
            --bg-dark-green: #1A3026;
            --bg-card: #223D31;
            --accent-gold: #C5A059;
            --gold-hover: #E5C17C;
            --text-light: #F4F1EA;
            --text-muted: #A3B1A8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark-green);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 5%;
            background-color: rgba(26, 48, 38, 0.95);
            border-bottom: 1px solid var(--accent-gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-img {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-gold);
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 0.3rem 0.8rem;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .lang-btn:hover {
            background-color: var(--accent-gold);
            color: var(--bg-dark-green);
        }

        /* Hero Section */
        .hero {
            padding: 3rem 5% 4rem;
            text-align: center;
            border-bottom: 1px solid rgba(197, 160, 89, 0.3);
        }

        .hero h1 {
            font-size: 2.5rem;
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
        }

        .hero h2 {
            font-size: 1.25rem;
            color: var(--text-light);
            font-weight: normal;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto 2rem;
        }

        /* Responsive Media Query for Mobile Menu */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 0.8rem;
                padding: 0.8rem 1rem;
            }

            .nav-links {
                gap: 0.6rem 1rem;
                justify-content: center;
                flex-wrap: wrap;
            }

            .nav-links a {
                font-size: 0.85rem;
            }

            .logo-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo-container">
            <img src="hero-banner.png" alt="Logo" class="logo-img">
            <span class="logo-text">บ้านธรรมสถิตย์</span>
        </div>
        <ul class="nav-links">
            <li><a href="#">หน้าแรก</a></li>
            <li><a href="#">ร้อยตรี ดร.ทวี บูรณเขตต์</a></li>
            <li><a href="#">นิทรรศการ</a></li>
            <li><a href="#">บทความ</a></li>
            <li><a href="#">วิดีโอ</a></li>
            <li><a href="#">เวิร์กชอป</a></li>
            <li><a href="#">เข้าชม & ติดต่อ</a></li>
            <li><button class="lang-btn">EN</button></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>บ้านธรรมสถิตย์</h1>
        <h2>ผู้สืบสานสกุลช่างพิษณุโลก จ่าทวี</h2>
        <p>แหล่งเรียนรู้ความโดดเด่นแห่งงานพุทธศิลป์ สกุลช่างพิษณุโลก จ่าทวี พร้อมกิจกรรมเวิร์กชอป</p>
    </section>

</body>
</html>
